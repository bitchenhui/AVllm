# Starting point for M2 Max 32GB; adjust iters to reviewed dataset size.
model: models/qwen3-4b-mlx-4bit
train: true
fine_tune_type: lora
data: data/splits/pilot
seed: 42
num_layers: 16
batch_size: 1
# MLX iters count microbatches, not optimizer updates. 1600/4 = 400 updates.
iters: 1600
learning_rate: 1.0e-5
max_seq_length: 2048
grad_checkpoint: true
grad_accumulation_steps: 4
mask_prompt: true
val_batches: 25
steps_per_report: 20
steps_per_eval: 200
save_every: 400
adapter_path: adapters/phase1-sft
lora_parameters:
  rank: 16
  dropout: 0.0
  scale: 32.0
